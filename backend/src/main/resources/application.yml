spring:
  application:
    name: plateforme-scolaire
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/scolaire}
    username: ${DB_USER:scolaire}
    password: ${DB_PASSWORD:scolaire}
  jpa:
    open-in-view: false
    hibernate:
      # Le schéma est géré uniquement par Flyway.
      # Essayer "validate" pour vérifier que les entités correspondent au schéma.
      ddl-auto: validate      # avant : none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  task:
    execution:
      # Tâches de fond (e-mails des annonces) : peu de fils, file d'attente bornée.
      pool:
        core-size: 2
        max-size: 4
        queue-capacity: 200
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 7MB
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  # Taille maximale d'une requête (en-tête Content-Length). Au-delà : 413.
  taille-requete-max: ${TAILLE_REQUETE_MAX:1MB}
  # Envoi d'une pièce jointe d'inspection (PDF, photo) : limite de la requête, puis du fichier.
  taille-envoi-max: ${TAILLE_ENVOI_MAX:6MB}
  piece-jointe-max: ${PIECE_JOINTE_MAX:5MB}
  securite:
    # Code envoyé par e-mail à chaque connexion du ministère et des directions régionales.
    double-authentification: ${DOUBLE_AUTHENTIFICATION:false}
  annonces:
    # Prévenir les parents de la classe par e-mail à chaque annonce (seul le titre est envoyé, jamais le texte).
    email: ${ANNONCES_EMAIL:true}
  sms:
    # Annonces par SMS aux parents (désactivé par défaut : un SMS coûte de l'argent).
    annonces: ${SMS_ANNONCES:false}
    # Alertes d'inspection urgente aux directions régionales et au ministère.
    alertes: ${SMS_ALERTES:true}
    # SMS aux parents quand leur enfant est noté absent (non justifié) à l'appel (désactivé par défaut : coût).
    absences: ${SMS_ABSENCES:false}
    # Écrit les SMS dans les journaux quand aucune passerelle n'est configurée (développement).
    journaliser: ${SMS_JOURNALISER:false}
  rapports:
    entete: ${RAPPORTS_ENTETE:Ministère de l'Éducation}
    sous-entete: ${RAPPORTS_SOUS_ENTETE:République de Guinée}
  postes:
    # Norme utilisée pour estimer les besoins en enseignants.
    eleves-par-enseignant: ${ELEVES_PAR_ENSEIGNANT:40}
  alertes:
    actif: ${ALERTES_ACTIF:true}
    # Tous les jours à 7 h.
    cron: ${ALERTES_CRON:0 0 7 * * *}
  reussite:
    # Durée de conservation du taux de réussite national/régional (0 = pas de cache).
    cache-minutes: ${REUSSITE_CACHE_MINUTES:10}
  jwt:
    # 32 caractères minimum. Valeur de développement uniquement.
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    expiration-minutes: 60
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
  mail:
    # Expéditeur et adresse du site web (lien de réinitialisation du mot de passe).
    # Le serveur SMTP se règle par variables d'environnement : SPRING_MAIL_HOST, SPRING_MAIL_PORT,
    # SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD. Sans SPRING_MAIL_HOST, aucun e-mail n'est envoyé.
    de: ${MAIL_DE:no-reply@plateforme-scolaire.local}
    url-front: ${FRONT_URL:http://localhost:5173}
    journaliser: ${MAIL_JOURNALISER:false}
  paiement:
    # Vide = paiement en ligne désactivé. "simule" = faux prestataire (dev). Un vrai prestataire = son propre adaptateur.
    fournisseur: ${PAIEMENT_FOURNISSEUR:}
    # Secret partagé avec le prestataire pour signer les notifications. Obligatoire dès qu'un fournisseur est actif.
    secret-webhook: ${PAIEMENT_WEBHOOK_SECRET:}
    # Un paiement en ligne resté EN_ATTENTE plus longtemps est clôturé (ECHEC) par une tâche horaire.
    expiration-heures: ${PAIEMENT_EXPIRATION_HEURES:24}
    expiration-cron: "0 5 * * * *"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
