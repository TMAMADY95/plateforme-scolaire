spring:
  application:
    name: plateforme-scolaire
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/scolaire}
    username: ${DB_USER:scolaire}
    password: ${DB_PASSWORD:scolaire}
  jpa:
    open-in-view: false
    hibernate:
      # Le schéma est géré uniquement par Flyway.
      # Essayer "validate" pour vérifier que les entités correspondent au schéma.
      ddl-auto: validate      # avant : none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    # 32 caractères minimum. Valeur de développement uniquement.
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    expiration-minutes: 60
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
